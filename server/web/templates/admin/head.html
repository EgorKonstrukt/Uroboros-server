<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uroboros Admin</title>
<script>(function(){var t='light';try{t=localStorage.getItem('uroboros_theme')||'light';}catch(e){}document.documentElement.classList.toggle('theme-dark',t==='dark');})();</script>
<link rel="stylesheet" href="/admin/static/css/base.css?v=6">
<link rel="stylesheet" href="/admin/static/css/layout.css?v=6">
<link rel="stylesheet" href="/admin/static/css/components.css?v=10">
<link rel="stylesheet" href="/admin/static/css/tables.css?v=6">
<link rel="stylesheet" href="/admin/static/css/modals.css?v=6">
<link rel="stylesheet" href="/admin/static/css/cards.css?v=7">
<link rel="stylesheet" href="/admin/static/css/filemanager.css?v=2">
<link rel="stylesheet" href="/admin/static/css/animations.css?v=1">
</head>
<body>
<div id="toast"></div>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">U</div>
      <div class="brand-text">
        <span class="brand-name">Uroboros</span>
        <span class="brand-desc">Project Control</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-label">GENERAL</div>
      <button class="nav-item active" data-tab="projects" onclick="switchTab('projects')">Projects</button>
      <button class="nav-item" data-tab="players" onclick="switchTab('players')">Players</button>
      <button class="nav-item" data-tab="config" onclick="switchTab('config')">Config</button>
      <button class="nav-item" data-tab="java" onclick="switchTab('java')">Java</button>
      <button class="nav-item" data-tab="update" onclick="switchTab('update')">Update</button>
      <div class="nav-sep"></div>
      <div class="nav-label">SERVERS</div>
      <div id="sidebarServerList">
        <div class="nav-item nav-placeholder">No servers</div>
      </div>
      <button class="nav-item nav-add-srv" onclick="showAddServer()">+ Add Server</button>
    </nav>
    <div class="sidebar-footer">
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="page-title" id="pageTitle">Projects</h2>
      </div>
      <div class="topbar-right">
        <div id="topActions"></div>
        <div id="serverMiniBar" style="display:none;align-items:center;gap:6px">
          <span id="selServerName" style="font-size:13px;font-weight:600"></span>
          <span id="selServerBadge" class="badge badge-stopped">STOPPED</span>
        </div>
        <button class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7z M2,13h2c0.55,0,1-0.45,1-1s-0.45-1-1-1H2C1.45,11,1,11.45,1,12S1.45,13,2,13z M20,13h2c0.55,0,1-0.45,1-1s-0.45-1-1-1h-2c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1S11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0c0.39-0.39,0.39-1.03,0-1.41L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z"/></svg>
        </button>
      </div>
    </header>

    <div id="serverTabBar" class="server-tab-bar" style="display:none">
      <div id="serverTabs" class="server-tabs"></div>
      <button class="server-tab-add" onclick="showAddServer()" title="Add Server">+</button>
    </div>

    <div class="content">
