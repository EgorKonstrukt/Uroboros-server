  <div class="modal">
    <h2 id="banModalTitle">Ban Player</h2>

      <div id="banServersList" class="ban-servers-list"></div>
    </div>
    <div class="md-field">
      <label>Duration</label>
      <select id="banDurationSelect" onchange="onBanDurationChange()" style="width:100%;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
        <option value="0">Forever</option>
        <option value="3600">1 hour</option>
        <option value="21600">6 hours</option>
        <option value="86400">1 day</option>
        <option value="604800">7 days</option>
        <option value="2592000">30 days</option>
        <option value="__custom">Custom...</option>
      </select>
      <div id="banCustomDuration" style="display:none;margin-top:8px">
        <input id="banDurationValue" type="number" min="1" value="1" style="width:80px;padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
        <select id="banDurationUnit" style="padding:8px 12px;border:2px solid #bdbdbd;border-radius:4px;font:14px sans-serif">
          <option value="60">minutes</option>
          <option value="3600" selected>hours</option>
          <option value="86400">days</option>
        </select>
      </div>
    </div>
    <div class="md-field">
      <label>Reason</label>
      <input id="banReasonInput" placeholder="Reason for the ban">
    </div>
    <div class="md-field" style="margin-top:-4px">
      <span style="font-size:12px;color:#888">The ban also applies to this player's email, IP addresses and nickname (any account sharing them).</span>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('banModal')">Cancel</button>
      <button class="btn btn-stop" onclick="confirmBan()">Ban</button>
    </div>
  </div>
</div>
