<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uroboros - Login</title>
<script>(function(){var t='light';try{t=localStorage.getItem('uroboros_theme')||'light';}catch(e){}document.documentElement.classList.toggle('theme-dark',t==='dark');window.toggleTheme=function(){var d=document.documentElement.classList.contains('theme-dark');var n=d?'light':'dark';document.documentElement.classList.toggle('theme-dark',n==='dark');try{localStorage.setItem('uroboros_theme',n);}catch(e){}};})();</script>
<link rel="stylesheet" href="/admin/static/css/base.css?v=7">
<link rel="stylesheet" href="/admin/static/css/components.css?v=6">
<link rel="stylesheet" href="/admin/static/css/animations.css?v=3">
</head>
<body class="login-body">
<button class="icon-btn" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode" style="position:fixed;top:16px;right:16px;color:#fff;background:rgba(0,0,0,.28)">
  <svg class="icon-moon" viewBox="0 0 24 24"><path d="M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24"><path d="M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5S14.76,7,12,7z M2,13h2c0.55,0,1-0.45,1-1s-0.45-1-1-1H2C1.45,11,1,11.45,1,12S1.45,13,2,13z M20,13h2c0.55,0,1-0.45,1-1s-0.45-1-1-1h-2c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1S11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0c0.39-0.39,0.39-1.03,0-1.41L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z"/></svg>
</button>
<div class="login-card">
  <h1>Uroboros Server</h1>
  <p class="subtitle">Enter admin password to continue</p>
  <div class="md-field">
    <label for="passwordInput">Password</label>
    <input id="passwordInput" type="password" placeholder="Password" autofocus onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn btn-start" onclick="doLogin()" id="loginBtn" style="width:100%;justify-content:center">Login</button>
  <div id="loginError"></div>
</div>
<script>
async function doLogin() {
  var pw = document.getElementById('passwordInput').value;
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  if (!pw) { err.textContent = 'Please enter a password'; err.style.display = 'block'; return; }
  err.style.display = 'none';
  btn.disabled = true;
  btn.classList.add('btn-loading');
  btn.textContent = 'Logging in...';
  try {
    var r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw }) });
    var d = await r.json();
    if (d.token) { sessionStorage.setItem('admin_token', d.token); window.location.href = '/admin/'; }
    else { err.textContent = d.error || 'Login failed'; err.style.display = 'block'; }
  } catch (e) { err.textContent = 'Connection error'; err.style.display = 'block'; }
  btn.disabled = false;
  btn.classList.remove('btn-loading');
  btn.textContent = 'Login';
}
</script>
</body>
</html>
